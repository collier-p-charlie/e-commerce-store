[project]
name = "e-commerce-backend"
description = "Project for store backend"
authors = [
  { name = "Charlie Collier", email = "collier.p.charlie@gmail.com" }
]
maintainers = [
  { name = "Charlie Collier", email = "collier.p.charlie@gmail.com" }
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: Hatch"
]
version = "1.0.0"  # https://packaging.python.org/en/latest/discussions/versioning/
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn==0.46.0",
    "sqlalchemy==2.0.49",
    "pydantic-settings==2.14.0",
    "pydantic[email]==2.13.3",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "alembic==1.18.4"
]

[project.optional-dependencies]
# These will install if installing the subproject, e.g. "pip install .[name]" or --extra test
dev = [
    # for testing
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "httpx==0.28.1"
]
